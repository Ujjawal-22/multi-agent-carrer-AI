services:
  postgres:
    image: postgres:16-alpine
    container_name: career_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: career_ai
      POSTGRES_PASSWORD: career_ai
      POSTGRES_DB: career_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: career_ai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: career_ai_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://career_ai:career_ai@postgres:5432/career_ai
      QDRANT_URL: http://qdrant:6333
      TESSERACT_CMD: tesseract
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  qdrant_data:
